name: CI

# Local Agent targets Windows 11 only in Phase 1 (see docs/PROJECT_SPEC.md
# and docs/phase-1-scope.md — macOS and Linux support is explicitly deferred,
# and the encrypted secret store is backed by Windows DPAPI via Electron's
# safeStorage). CI therefore runs on windows-latest exclusively: that is the
# only platform the application is designed for and verified against, and it
# is also the only runner that can launch the real Electron app for the
# end-to-end suite without extra scaffolding — a Linux runner would need
# xvfb-run (or an equivalent virtual display) purely to work around a
# platform this project does not ship on, which would verify a configuration
# no user ever runs.
#
# No secret is used by this workflow today. The "Package Windows installer"
# step below references two optional repository secrets, CSC_LINK and
# CSC_KEY_PASSWORD, for a future Windows code-signing certificate — see
# docs/phase-3-code-signing.md. Neither secret exists in this repository as
# of this commit, so both evaluate to an empty string and
# scripts/check-signing-config.mjs treats that exactly like signing was
# never requested, producing the same unsigned installer this step has
# always produced. There is still no deployment step, no package publish,
# and no external service call — every job runs entirely against the
# checked-out repository and the npm registry.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x is the floor declared in package.json's "engines" field — CI
        # must prove that floor actually works, not only the newer version
        # development happens to run locally. 24.x matches the version this
        # project is developed against (see README "Requirements").
        node-version: ['20.x', '24.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test (Playwright + Electron)
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=low

      # Runs once, not once per Node version: the installer itself doesn't
      # depend on which Node built it, and electron-builder's NSIS tooling
      # download is the slow part of this step. CSC_LINK/CSC_KEY_PASSWORD
      # are unset repository secrets today (see the file header comment and
      # docs/phase-3-code-signing.md) — this step produces an unsigned
      # installer until the repository owner adds a real certificate.
      - name: Package Windows installer
        if: matrix.node-version == '24.x'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run package:win
